{% extends "accounts/base.html" %}{% block title %}Log in · Netwatch{% endblock %}{% block content %}<section class="card" style="max-width:480px;margin:auto"><p class="muted" style="margin-top:0">WELCOME BACK</p><h1>Log in to Netwatch</h1><p class="muted">Sign in to continue to your network dashboard.</p>{% if error %}<p class="errorlist">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="identifier">Username or email</label><input id="identifier" name="identifier" required value="{{ identifier }}" autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit" style="width:100%">Log in</button></form><p class="muted" style="margin-bottom:0">New to Netwatch? <a href="{% url 'accounts:register' %}">Create an account</a></p></section>{% endblock %}
